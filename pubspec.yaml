name: travelmateai
description: TravelMate AI — AI-powered travel planner by UK Solutions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  get: ^4.7.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  firebase_remote_config: ^5.4.3
  firebase_app_check: ^0.3.2+5

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # Authentication
  google_sign_in: ^6.3.0

  # Maps & location
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.4

  # Ads
  google_mobile_ads: ^5.3.0

  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # UI & animations
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_storage: ^2.1.1
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  logger: ^2.5.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - .env
    - .env.example

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app-icon.png
  adaptive_icon_background: '#006D77'
  adaptive_icon_foreground: assets/icons/app-icon.png